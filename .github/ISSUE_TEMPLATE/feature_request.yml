name: Request a feature for Beach Weather
description: Suggest a new feature or an enhancement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue form is for feature requests only!

        If something is broken, please [report a bug instead][bug].

        [bug]: https://github.com/LuckyTriple7/ha-beach-weather/issues/new?template=bug_report.yml
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the [existing issues](https://github.com/LuckyTriple7/ha-beach-weather/issues?q=is%3Aissue) and this has not been requested yet.
          required: true
        - label: This is a request for Beach Weather, not for Home Assistant Core or the Open-Meteo API.
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: The problem you are trying to solve
      description: >-
        A clear and concise description of what you are missing today.
        Tell us what you are trying to achieve, not only the solution you have in mind.
      placeholder: |
        I want to automate ... but there is currently no way to ...
  - type: textarea
    validations:
      required: true
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
  - type: dropdown
    id: area
    validations:
      required: true
    attributes:
      label: Which part of the integration does this affect?
      options:
        - New sensor / data point
        - Weather entity / forecast
        - Lovelace card (custom:beach-weather-card)
        - Config flow / options
        - Services / actions
        - Translations
        - Documentation
        - Other / not sure
  - type: input
    id: data_source
    attributes:
      label: Data source
      description: >-
        If you are requesting a new value, which Open-Meteo API and variable provides it?
        See the [Marine](https://open-meteo.com/en/docs/marine-weather-api) and
        [Forecast](https://open-meteo.com/en/docs) API docs.
      placeholder: "Marine API, variable: sea_level_height_msl"
  - type: textarea
    attributes:
      label: Alternatives you considered
      description: >-
        Templates, automations or other integrations you already tried, and why they
        do not solve the problem.
  - type: textarea
    attributes:
      label: Additional information
      description: >
        Mockups, screenshots, links or anything else that helps explain the request.
